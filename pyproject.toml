[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-summary"
version = "0.1.0"
description = "Portfolio earnings-summary data pipeline"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "ruff>=0.5",
    "pyright>=1.1.380",
    "basedpyright>=1.10",
]
# IR-document discovery (execution/refresh_ir_kpis.py --discover): a headless
# browser renders the JS results-center to resolve hash-keyed document URLs.
# Install with `pip install -e .[ir] && playwright install chromium`.
ir = [
    "playwright>=1.40",
]
# DCF <-> Google Sheets round-trip (execution/dcf_sheets.py export/import): pushes
# the DCF workbook to a Google Sheet and pulls the edited Sheet back to recompute.
# Imported lazily in src/integrations/gsheets.py, so the credential-free re-ingest
# `--file` path never needs these. Install with `pip install -e .[gsheets]`.
# See directives/dcf_gsheets_setup.md for the credential setup.
gsheets = [
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["venv*", "data*", "transcripts*", "ir_documents*", ".tmp*", ".cache*", "scratch*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", ".tmp", ".cache", "data", "transcripts", "ir_documents", "scratch", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "RET",
    "SIM",
    "RUF",
]
ignore = [
    "E501",   # line length — handled by formatter
    "RUF002", # ambiguous unicode in docstrings — × is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N802"]
"alembic/**" = ["N999"]
# fmp_payloads + the Protocol in compute/_common.py mirror FMP's exact JSON
# keys (camelCase); aliasing every field would add boilerplate.
"src/models/fmp_payloads.py" = ["N815"]
"src/compute/_common.py" = ["N815"]
# DCF forecast/valuation use the `_M` (USD millions) units convention on fields +
# the `diluted_shares_M` argument.
"src/dcf/forecast.py" = ["N815"]
"src/dcf/valuation.py" = ["N815", "N803"]

[tool.pyright]
include = ["src", "execution", "tests"]
exclude = ["venv", ".tmp", ".cache", "data", "transcripts", "ir_documents", "scratch", "alembic/versions"]
# `execution` is an import root too: its CLIs import each other as top-level
# modules (e.g. `import refresh_dcf`) and tests import them (`import comments_server`)
# after a runtime sys.path.insert. Listing it here lets pyright resolve those —
# without it every such import is an unresolved-import error with a cascade of
# Unknowns behind it.
extraPaths = ["src", "execution", "scratch"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.basedpyright]
include = ["src", "execution", "tests"]
exclude = ["venv", ".tmp", ".cache", "data", "transcripts", "ir_documents", "scratch", "alembic/versions"]
extraPaths = ["src", "execution", "scratch"]
pythonVersion = "3.11"
typeCheckingMode = "all"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportAny = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src", "scratch"]
