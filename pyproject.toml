[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-summary"
version = "0.1.0"
description = "Portfolio earnings-summary data pipeline"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "ruff>=0.5",
    "pyright>=1.1.380",
    "basedpyright>=1.10",
]
# IR-document discovery (execution/refresh_ir_kpis.py --discover): a headless
# browser renders the JS results-center to resolve hash-keyed document URLs.
# Install with `pip install -e .[ir] && playwright install chromium`.
ir = [
    "playwright>=1.40",
    # curl_cffi replays a real Chrome TLS/HTTP2 fingerprint for the document
    # downloader — some issuer hosts (e.g. investor.lilly.com) tarpit any client
    # whose fingerprint isn't a browser's. See fetch_ir_documents._fetch_curl_cffi.
    "curl_cffi>=0.7",
    # PyMuPDF is the preferred first-page fingerprint extractor in ir_uploads:
    # markedly faster and far more robust than pypdf on large, graphics-heavy
    # investor decks (a 200+ page Investor Day deck stalled pypdf for minutes).
    # Optional — ir_uploads.fingerprint_pdf falls back to pypdf when it's absent.
    "pymupdf>=1.24",
]
# DCF <-> Google Sheets round-trip (execution/dcf_sheets.py export/import): pushes
# the DCF workbook to a Google Sheet and pulls the edited Sheet back to recompute.
# Imported lazily in src/integrations/gsheets.py, so the credential-free re-ingest
# `--file` path never needs these. Install with `pip install -e .[gsheets]`.
# See directives/dcf_gsheets_setup.md for the credential setup.
gsheets = [
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["venv*", "data*", "transcripts*", "ir_documents*", ".tmp*", ".cache*", "scratch*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", ".tmp", ".cache", "data", "transcripts", "ir_documents", "scratch", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "RET",
    "SIM",
    "RUF",
]
ignore = [
    "E501",   # line length — handled by formatter
    "RUF002", # ambiguous unicode in docstrings — × is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N802"]
"alembic/**" = ["N999"]
# fmp_payloads + the Protocol in compute/_common.py mirror FMP's exact JSON
# keys (camelCase); aliasing every field would add boilerplate.
"src/models/fmp_payloads.py" = ["N815"]
"src/compute/_common.py" = ["N815"]
# DCF forecast/valuation use the `_M` (USD millions) units convention on fields +
# the `diluted_shares_M` argument.
"src/dcf/forecast.py" = ["N815"]
"src/dcf/valuation.py" = ["N815", "N803"]
# Redesigned-DCF CLI tools: dynamic openpyxl workbook builder + LLM assumption
# pass. Math-style/_M variable names, print() output, and per-cell loops are
# idiomatic here; strict naming/style rules add noise without value.
"execution/build_redesigned_dcf.py" = ["N816", "N806", "N803", "N815", "B007", "T201", "SIM105", "SIM222", "RUF003"]
"execution/build_bank_dcf.py" = ["N816", "N806", "N803", "N815", "B007", "T201", "SIM105", "SIM222", "RUF003"]
"execution/build_holdco_sotp.py" = ["N816", "N806", "N803", "N815", "B007", "T201", "SIM105", "SIM222", "RUF001", "RUF003"]
"execution/build_fintech_sotp.py" = ["N816", "N806", "N803", "N815", "B007", "T201", "SIM105", "SIM222", "RUF001", "RUF002", "RUF003"]
"execution/build_nu_platform_dcf.py" = ["N816", "N806", "N803", "N815", "B007", "T201", "SIM105", "SIM222", "RUF003"]
"execution/build_meli_platform_dcf.py" = ["N816", "N806", "N803", "N815", "B007", "T201", "SIM105", "SIM222", "RUF001", "RUF002", "RUF003"]
"execution/dcf_opus_assumptions.py" = ["N816", "N806", "N803", "B007", "T201", "SIM105", "SIM222"]

[tool.pyright]
include = ["src", "execution", "tests"]
# The two redesigned-DCF CLI tools are dynamic openpyxl/LLM scripts (cell objects,
# JSON dicts) where strict typing yields ~500 unknown-type errors with no real
# bugs caught — excluded like scratch/, the same way other dynamic scripts are.
# import_owner_capacity.py joins them for the same reason: it imports
# wealthplan's OWN Pydantic models (owner decision 2026-07-17) via a runtime
# sys.path.insert into a SIBLING repo outside this project — pyright has no
# static resolution path to it (extraPaths only covers this repo's own
# subtrees), so every wealthplan.* symbol cascades to Unknown with no real bug
# behind it. The importer's OWN types (owner_profile.models/.store) are fully
# typed and covered by the pyright run over that package.
# src/integrations/wealthplan_capacity.py (tenet-2 Phase 2) joins them for the
# IDENTICAL reason — it's a runtime reader over the same sibling-repo sys.path
# boundary, not an importer, but the wealthplan.* symbols cascade to Unknown
# the same way. Its OWN types (WealthplanCashNeedSummary, the band Literal)
# are fully typed and covered normally.
exclude = ["venv", ".tmp", ".cache", "data", "transcripts", "ir_documents", "scratch", "alembic/versions",
           "execution/build_redesigned_dcf.py", "execution/build_bank_dcf.py", "execution/build_holdco_sotp.py",
           "execution/build_fintech_sotp.py", "execution/build_nu_platform_dcf.py", "execution/build_meli_platform_dcf.py", "execution/dcf_opus_assumptions.py",
           "execution/import_owner_capacity.py", "src/integrations/wealthplan_capacity.py"]
# `execution` is an import root too: its CLIs import each other as top-level
# modules (e.g. `import refresh_dcf`) and tests import them (`import comments_server`)
# after a runtime sys.path.insert. Listing it here lets pyright resolve those —
# without it every such import is an unresolved-import error with a cascade of
# Unknowns behind it.
extraPaths = ["src", "execution", "scratch", "cron"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
# Flask registers route handlers via the @app.route decorator as a side effect,
# so pyright sees every nested route function as "never accessed" — ~30 false
# positives across execution/comments_server.py alone. The rule is pure noise for
# this codebase's decorator-driven web layer, so disable it (same spirit as the
# two report* relaxations above). Genuinely-dead module-level code is still
# caught by ruff's F401/F811.
reportUnusedFunction = false
# Uppercase module-level paths (db.DB_PATH/DATA_DIR/FMP_DIR, registry._DB_PATH, …)
# are intentionally MUTABLE — re-pointed by setter functions (db.set_db_path,
# sources.registry.set_db_path) so a CLI's --db-path/--repo-root reaches writers
# that resolve from the global. pyright's "all-caps == constant" heuristic
# false-flags every such setter (12 instances repo-wide). Disable it (same spirit
# as the relaxations above); accidental redefinition is still caught in review.
reportConstantRedefinition = false

[tool.basedpyright]
include = ["src", "execution", "tests"]
exclude = ["venv", ".tmp", ".cache", "data", "transcripts", "ir_documents", "scratch", "alembic/versions",
           "execution/build_redesigned_dcf.py", "execution/build_bank_dcf.py", "execution/build_holdco_sotp.py",
           "execution/build_fintech_sotp.py", "execution/build_nu_platform_dcf.py", "execution/build_meli_platform_dcf.py", "execution/dcf_opus_assumptions.py",
           "execution/import_owner_capacity.py", "src/integrations/wealthplan_capacity.py"]
extraPaths = ["src", "execution", "scratch", "cron"]
pythonVersion = "3.11"
typeCheckingMode = "all"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportAny = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src", "scratch"]
