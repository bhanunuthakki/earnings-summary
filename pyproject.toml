[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-summary"
version = "0.1.0"
description = "Portfolio earnings-summary data pipeline"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "ruff>=0.5",
    "pyright>=1.1.380",
    "basedpyright>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["venv*", "data*", "transcripts*", "ir_documents*", ".tmp*", ".cache*", "scratch*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", ".tmp", ".cache", "data", "transcripts", "ir_documents", "scratch", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "RET",
    "SIM",
    "RUF",
]
ignore = [
    "E501",   # line length — handled by formatter
    "RUF002", # ambiguous unicode in docstrings — × is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N802"]
"alembic/**" = ["N999"]
# fmp_payloads mirrors FMP's exact JSON keys (camelCase); aliasing every
# field would add boilerplate without semantic value.
"src/models/fmp_payloads.py" = ["N815"]

[tool.pyright]
include = ["src", "execution", "tests"]
exclude = ["venv", ".tmp", ".cache", "data", "transcripts", "ir_documents", "scratch", "alembic/versions"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.basedpyright]
include = ["src", "execution", "tests"]
exclude = ["venv", ".tmp", ".cache", "data", "transcripts", "ir_documents", "scratch", "alembic/versions"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "all"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportAny = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
