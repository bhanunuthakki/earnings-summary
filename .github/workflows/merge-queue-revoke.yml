name: Merge Queue Revoke

# The `merge-queue` label approves one reviewed head. A new push, a reopen or a
# return to draft withdraws that approval. This workflow has no concurrency
# group, so a running queue controller can never delay or replace it; queue
# finalization also re-checks the head and label before it moves main.
# It reads only event metadata and never checks out pull-request code.

on:
  pull_request_target:
    types: [synchronize, reopened, converted_to_draft]

permissions: {}

jobs:
  revoke:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'merge-queue') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Withdraw the queue approval for the replaced head
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_PR: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 .github/scripts/merge_queue.py revoke
