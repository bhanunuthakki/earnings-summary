name: CI

# Quality-enforcement machinery for a repo with a large pre-existing lint/type
# baseline (ruff ~332, pyright strict ~3070 — tooling drift, see
# directives/regrade_memo_post_wedge.md). A whole-repo "must be clean" gate is
# therefore impossible without a months-long cleanup, so this workflow encodes
# the project's actual norm — "gate only on YOUR files" — as machinery:
#
#   * tests   — the FULL pytest suite must pass (the strong, whole-repo gate).
#   * quality — ruff lint (changed files) + format (changed LINES) are enforced
#               only on what a PR touched, so new code stays clean while the
#               legacy baseline is paid down incrementally rather than blocking
#               every PR.
#
# pyright (the strict type gate) runs as the `typecheck` job below — a RATCHET:
# it compares normalized whole-repo diagnostics in the PR against the base
# branch and fails on any genuinely NEW error. The legacy baseline is tolerated
# (never blocking) and paid down incrementally, exactly like the ruff diff gate.
# pyright also still runs locally via pre-commit / `make typecheck`.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Check Changed Paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      python: ${{ steps.classify.outputs.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
            git cat-file -e "$base^{commit}"
            git cat-file -e "$head^{commit}"
            git diff --name-only --no-renames -z "$base...$head" \
              | python .github/scripts/ci_gate.py classify --github-output "$GITHUB_OUTPUT"
          elif git rev-parse --quiet --verify "$PUSH_BEFORE_SHA^{commit}" >/dev/null 2>&1; then
            git diff --name-only --no-renames -z "$PUSH_BEFORE_SHA" "$CURRENT_SHA" \
              | python .github/scripts/ci_gate.py classify --github-output "$GITHUB_OUTPUT"
          else
            git diff-tree --root --no-commit-id --name-only --no-renames -z -r "$CURRENT_SHA" \
              | python .github/scripts/ci_gate.py classify --github-output "$GITHUB_OUTPUT"
          fi

  public-boundary:
    name: Public Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Reject private material in the published tree
        run: python execution/verify_public_tree.py

  tests:
    name: tests (shard ${{ matrix.label }}/8)
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # 40, not 25: the heaviest shards legitimately run 14-15 min, and hosted
    # runners routinely deliver ~2x slowdowns (disk/CPU contention), which put
    # shard 6 over a 25 min cap three times on 2026-07-31 while it was still
    # PASSING — every dot green, just slow. A timeout kill is reported as
    # `cancelled`, not `failure`, so it reads like a concurrency supersession
    # and costs a rerun to diagnose. 40 keeps ~2.5x headroom over the worst
    # observed honest run while still bounding a genuine hang.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # `split_count` subdivides a source shard WITHOUT changing which shard
        # a file lands in (that stays `index % 8`), so adding a split keeps
        # assignments stable (b93ead99). Shards 1 and 6 are the consistently
        # heaviest (886-929s and 674-851s vs 211-365s for shard 2's halves),
        # so they carry the split; that pulls the slowest job back to ~450s.
        include:
          - { label: "1", source_shard: 1, split_count: 2, split_part: 0 }
          - { label: "1 overflow", source_shard: 1, split_count: 2, split_part: 1 }
          - { label: "2", source_shard: 2, split_count: 2, split_part: 0 }
          - { label: "2 overflow", source_shard: 2, split_count: 2, split_part: 1 }
          - { label: "3", source_shard: 3, split_count: 1, split_part: 0 }
          - { label: "4", source_shard: 4, split_count: 1, split_part: 0 }
          - { label: "5", source_shard: 5, split_count: 1, split_part: 0 }
          - { label: "6", source_shard: 6, split_count: 2, split_part: 0 }
          - { label: "6 overflow", source_shard: 6, split_count: 2, split_part: 1 }
          - { label: "7", source_shard: 7, split_count: 1, split_part: 0 }
          - { label: "8", source_shard: 8, split_count: 1, split_part: 0 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Deletion governance verifies every cataloged rollback blob, not
          # only the audited-head ancestry. Those recovery commits outlive any
          # fixed cleanup window, so the test job requires complete history.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Build verified SQLite writer runtime
        shell: bash
        run: |
          set -euo pipefail
          sqlite_dir="$RUNNER_TEMP/sqlite-3.53.4"
          archive="$RUNNER_TEMP/sqlite-amalgamation-3530400.zip"
          mkdir -p "$sqlite_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip \
            --output "$archive"
          python - "$archive" <<'PY'
          import hashlib
          import pathlib
          import sys

          expected = "628a44cfe82c66aed1ccbbe85a562d2e33ebe64b3288981ed76285612227934e"
          observed = hashlib.sha3_256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          if observed != expected:
              raise SystemExit(f"SQLite archive SHA3-256 mismatch: {observed}")
          PY
          unzip -q "$archive" -d "$sqlite_dir"
          gcc -O2 -fPIC -shared -pthread -DSQLITE_ENABLE_FTS5 \
            "$sqlite_dir/sqlite-amalgamation-3530400/sqlite3.c" \
            -o "$sqlite_dir/libsqlite3.so.0" -lm -ldl
          echo "LD_PRELOAD=$sqlite_dir/libsqlite3.so.0" >> "$GITHUB_ENV"
          LD_PRELOAD="$sqlite_dir/libsqlite3.so.0" python - <<'PY'
          import sqlite3

          assert sqlite3.sqlite_version == "3.53.4", sqlite3.sqlite_version
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e .[dev]
      - name: Ensure data dir exists
        # The suite is hermetic (tmp_path everywhere); the few tests that touch
        # the gitignored data/portfolio.db degrade gracefully when it is absent
        # — verified by running the full suite with data/ moved aside (1940
        # passed). We only guarantee the directory exists so a test that writes
        # into data/ does not trip over a missing folder. (Full bootstrap is
        # init_db() + alembic, not `alembic upgrade head` alone — the 0000
        # baseline assumes the legacy init_db tables — so we skip it here.)
        run: mkdir -p data
      - name: Run test-suite shard
        shell: bash
        run: |
          set -euo pipefail
          # Browser canaries have one authoritative owner below: Design Sync,
          # which installs the hash-locked Playwright adapter and Chromium.
          mapfile -t all_files < <(
            find tests -type f -name 'test_*.py' \
              | grep -v '^tests/test_design_computed_canary.py$' \
              | sort
          )
          mapfile -t selected < <(
            printf '%s\n' "${all_files[@]}" |
              python .github/scripts/ci_gate.py select-tests \
                --source-shard '${{ matrix.source_shard }}' \
                --source-shards 8 \
                --split-count '${{ matrix.split_count }}' \
                --split-part '${{ matrix.split_part }}'
          )
          if (( ${#selected[@]} == 0 )); then
            echo "::error::test shard ${{ matrix.label }} selected no files"
            exit 1
          fi
          printf 'Shard %s/8: %s files\n' '${{ matrix.label }}' "${#selected[@]}"
          # --durations: `pytest -q` emits only dots, so when a shard stalls the
          # log shows a multi-minute gap between two dot rows and NOTHING about
          # which test caused it (this is what made the 2026-07-31 shard-6 kills
          # undiagnosable). The slowest-test table costs nothing and makes the
          # next occurrence attributable.
          pytest -q -n 2 --dist=loadfile --durations=25 "${selected[@]}"

  design:
    name: Design Sync
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-design.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - name: Build verified SQLite writer runtime
        shell: bash
        run: |
          set -euo pipefail
          sqlite_dir="$RUNNER_TEMP/sqlite-3.53.4"
          archive="$RUNNER_TEMP/sqlite-amalgamation-3530400.zip"
          mkdir -p "$sqlite_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip \
            --output "$archive"
          python - "$archive" <<'PY'
          import hashlib
          import pathlib
          import sys

          expected = "628a44cfe82c66aed1ccbbe85a562d2e33ebe64b3288981ed76285612227934e"
          observed = hashlib.sha3_256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          if observed != expected:
              raise SystemExit(f"SQLite archive SHA3-256 mismatch: {observed}")
          PY
          unzip -q "$archive" -d "$sqlite_dir"
          gcc -O2 -fPIC -shared -pthread -DSQLITE_ENABLE_FTS5 \
            "$sqlite_dir/sqlite-amalgamation-3530400/sqlite3.c" \
            -o "$sqlite_dir/libsqlite3.so.0" -lm -ldl
          echo "LD_PRELOAD=$sqlite_dir/libsqlite3.so.0" >> "$GITHUB_ENV"
          LD_PRELOAD="$sqlite_dir/libsqlite3.so.0" python - <<'PY'
          import sqlite3

          assert sqlite3.sqlite_version == "3.53.4", sqlite3.sqlite_version
          PY
      - name: Install runtime dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-design.lock
          pip install -e .[dev]
          python -m playwright install --with-deps --only-shell chromium
      - name: Verify canonical design tokens and production Work OS contract
        env:
          DESIGN_DEBT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/check_design_sync.py
          python scripts/gen_design_conformance_debt.py --base-ref "$DESIGN_DEBT_BASE_REF" --allow-missing-base
      - name: Verify React component types and visual token purity
        working-directory: design-system
        run: |
          npm ci
          npm run check
      - name: Run mandatory rendered route canary matrix
        run: |
          # The CLI owns the single full 9-route x 2-viewport matrix. Unit
          # tests retain the positive and adversarial browser checks without
          # paying for that matrix a second time.
          python -m pytest -q tests/test_design_computed_canary.py -k "not route_canary_matrix_covers_all_required_routes_and_viewports"
          python execution/verify_design_conformance.py --check --route-canaries

  quality:
    needs: [changes]
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install ruff
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e .[dev]
      - name: LLM eval coverage - no new registered gaps
        # Provider-free registry check: adding a purpose to either LLM_MODELS
        # or prompt_versions must include a real quality eval in the same PR.
        # Existing uncovered purposes are explicit debt and cannot grow.
        run: python execution/run_llm_evals.py --coverage-gate --repo-root .
      - name: Compute changed Python files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if ! git rev-parse --quiet --verify "$base^{commit}" >/dev/null 2>&1; then
              base="HEAD~1"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # Changed .py files, excluding generated migrations and scratch/
          # (both excluded from the ruff config too).
          changed=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.py' \
            | grep -vE '^(alembic/versions/|scratch/)' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$changed" ]; then
            echo "No Python files changed — quality gate is a no-op."
          else
            echo "Changed Python files:"
            echo "$changed"
          fi
      - name: ruff format (no NEW misformatting on changed lines)
        # Diff-aware format gate, mirroring the lint gate below. The repo carries
        # a large pre-existing `ruff format` backlog (247 files of tooling drift),
        # so a whole-file format check forces unrelated reformatting onto any PR
        # that merely touches a drifted file. Instead we fail only when a line the
        # PR actually changed is misformatted — see execution/format_changed.py.
        if: steps.changed.outputs.files != ''
        run: |
          echo "${{ steps.changed.outputs.files }}" \
            | xargs python execution/format_changed.py --base "${{ steps.changed.outputs.base }}"
      - name: ruff check (no NEW violations in changed files)
        # Diff-aware lint gate. The repo carries a large pre-existing ruff
        # baseline (~332 errors across many files — tooling drift), so a
        # whole-file "must be clean" check would fail on any PR that merely
        # touches a legacy file. Instead, for each changed file we compare the
        # violation count in this PR against the base branch's version and fail
        # only when the PR ADDS violations — new code stays clean while the
        # baseline is paid down incrementally. (ruff format above is likewise
        # diff-aware — gated on changed lines via execution/format_changed.py.)
        if: steps.changed.outputs.files != ''
        shell: bash
        run: |
          set -uo pipefail
          base="${{ steps.changed.outputs.base }}"
          status=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            head_n=$(ruff check "$f" --output-format=concise 2>/dev/null \
              | grep -cE '^[^:]+:[0-9]+:[0-9]+:' || true)
            base_n=$(git show "$base:$f" 2>/dev/null \
              | ruff check --stdin-filename "$f" --output-format=concise - 2>/dev/null \
              | grep -cE '^[^:]+:[0-9]+:[0-9]+:' || true)
            head_n=${head_n:-0}; base_n=${base_n:-0}
            if [ "$head_n" -gt "$base_n" ]; then
              echo "::error file=$f::ruff introduced $((head_n - base_n)) new violation(s) (${base_n} -> ${head_n})"
              ruff check "$f" --output-format=concise || true
              status=1
            fi
          done <<< "${{ steps.changed.outputs.files }}"
          if [ "$status" -eq 0 ]; then
            echo "No new ruff violations in changed files."
          fi
          exit "$status"

  typecheck:
    needs: [changes]
    if: ${{ needs.changes.outputs.python == 'true' }}
    # Diff-aware pyright (strict) ratchet. The repo carries a large pre-existing
    # strict baseline, so a whole-repo "must be clean" gate is impossible. Compare
    # normalized diagnostics in identical import context and block genuinely new
    # errors while the legacy baseline is paid down incrementally.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        # Runtime deps (so third-party imports resolve) + pyright. Deliberately
        # NOT `pip install -e .` — an editable install would point pyright at the
        # HEAD checkout's src even while analysing the base worktree, corrupting
        # the base count. First-party modules resolve via [tool.pyright].extraPaths.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install "pyright>=1.1.380" "pytest>=8" "alembic>=1.13" "sqlalchemy>=2.0"
      - name: Resolve base ref
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            b="${{ github.event.before }}"
            if ! git rev-parse --quiet --verify "$b^{commit}" >/dev/null 2>&1; then
              b="HEAD~1"
            fi
            echo "ref=$b" >> "$GITHUB_OUTPUT"
          fi
      - name: pyright strict — no NEW errors vs base (ratchet)
        shell: bash
        run: |
          set -euo pipefail
          head_json="$RUNNER_TEMP/pyright-head.json"
          base_json="$RUNNER_TEMP/pyright-base.json"
          pyright --outputjson > "$head_json" 2>/dev/null || true
          base="${{ steps.base.outputs.ref }}"
          wt="$RUNNER_TEMP/base-pyright"
          # Clear any stale worktree path from a retried job, then REQUIRE the
          # base checkout to succeed. A broken ratchet must BLOCK (exit 1), never
          # silently pass: the previous `exit 0` here was an escape hatch that
          # disabled the type gate on a transient infra hiccup (v6 re-grade,
          # Quality enforcement). fetch-depth:0 + the base fetch above make a
          # genuine failure exceptional, so failing closed is safe.
          rm -rf "$wt" 2>/dev/null || true
          if ! git worktree add --quiet --detach "$wt" "$base" 2>/dev/null; then
            echo "::error::could not check out base ($base) for the pyright ratchet — failing the type gate (a broken ratchet must block, not silently pass)."
            exit 1
          fi
          cleanup() { git worktree remove --force "$wt" 2>/dev/null || true; }
          trap cleanup EXIT
          (cd "$wt" && pyright --outputjson > "$base_json" 2>/dev/null) || true
          git worktree remove --force "$wt" 2>/dev/null || true
          trap - EXIT
          python .github/scripts/ci_gate.py pyright-diff \
            --base-json "$base_json" \
            --head-json "$head_json" \
            --base-root "$wt" \
            --head-root "$GITHUB_WORKSPACE"

  security:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    # Blocking supply-chain, secret, and SAST checks. Bandit carries an explicit
    # reviewed legacy baseline so regressions fail without pretending the
    # historical findings have already been remediated.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-design.lock
      - name: Install scanners + runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pip-audit bandit cyclonedx-bom detect-secrets
      - name: pip-audit — dependency CVEs
        id: pip_audit
        continue-on-error: true
        run: |
          pip-audit -r requirements.lock --progress-spinner off
          pip-audit -r requirements-design.lock --progress-spinner off
      - name: bandit — no new medium+ SAST findings
        id: bandit
        continue-on-error: true
        run: bandit -q -r src execution -ll -b .bandit-baseline.json
      - name: detect-secrets - no new credential material
        id: detect_secrets
        continue-on-error: true
        shell: bash
        run: >-
          git ls-files -z |
          xargs -0 detect-secrets-hook
          --exclude-files
          '^(?:data[\\/]fmp_canary_manifest\.json|evals[\\/]receipts[\\/].*|docs[\\/]hardening[\\/].*|docs[\\/]quality[\\/](?:architecture-initial-09d35d1a|duplicates-initial-09d35d1a|static-baseline|compatibility-baseline)\.json|config[\\/]filing_xbrl_processor_(?:approval|bundle)\.json|docs[\\/]design[\\/]deletion_catalog_2026_08\.json|evals[\\/]golden[\\/]metric_lifecycle_triage\.json|tests[\\/](?:test_etf_instrument_mvp|test_gemini_backend|test_peer_selection|test_validate_environment)\.py)$'
      - name: Generate CycloneDX SBOM
        id: sbom
        continue-on-error: true
        run: |
          cyclonedx-py requirements requirements.lock --output-file sbom-runtime.cdx.json
          cyclonedx-py requirements requirements-design.lock --output-file sbom-design.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && hashFiles('sbom-*.cdx.json') != '' }}
        with:
          name: cyclonedx-sbom
          path: sbom-*.cdx.json
      - name: Require every security scanner to pass
        if: ${{ always() }}
        env:
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          DETECT_SECRETS_OUTCOME: ${{ steps.detect_secrets.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for result in \
            "$PIP_AUDIT_OUTCOME" \
            "$BANDIT_OUTCOME" \
            "$DETECT_SECRETS_OUTCOME" \
            "$SBOM_OUTCOME"; do
            if [ "$result" != "success" ]; then
              status=1
            fi
          done
          exit "$status"

  merge-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, public-boundary, tests, design, quality, typecheck, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every applicable job to pass
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code || 'false' }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python || 'false' }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          PUBLIC_BOUNDARY_RESULT: ${{ needs.public-boundary.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DESIGN_RESULT: ${{ needs.design.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: >-
          python .github/scripts/ci_gate.py verify
          --code "$CODE_CHANGED"
          --python "$PYTHON_CHANGED"
          --changes-result "$CHANGES_RESULT"
          --public-boundary-result "$PUBLIC_BOUNDARY_RESULT"
          --tests-result "$TESTS_RESULT"
          --design-result "$DESIGN_RESULT"
          --quality-result "$QUALITY_RESULT"
