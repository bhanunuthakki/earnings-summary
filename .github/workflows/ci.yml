name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-boundary:
    name: Public Boundary & Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify public tree boundary
        run: python execution/verify_public_tree.py
      - name: Install leak scanner
        run: pip install detect-secrets==1.5.0
      - name: Run leak scan
        run: python .github/scripts/leak_scan.py --cache "${{ runner.temp }}/scan-cache.json"

  quality:
    name: Format, Lint, Typecheck & Instructions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e .[dev]
      - name: Check formatting and lint
        run: |
          python -m ruff format --check --extend-exclude alembic/versions_archived .
          python -m ruff check .
      - name: Typecheck changed Python files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          changed_py=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.py' || true)
          if [ -n "$changed_py" ]; then
            # shellcheck disable=SC2086
            python -m pyright --pythonpath "$(which python)" $changed_py
          fi
      - name: Validate directives, folder contract, and instruction tests
        run: |
          python execution/validate_directive_manifest.py
          python execution/validate_folder_contract.py
          python -m pytest -q --noconftest instruction_tests/test_instruction_contracts.py
          .githooks/test_pre_push.sh

  tests:
    name: Test Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore verified SQLite 3.53.4 writer runtime
        id: sqlite_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sqlite-3.53.4
          key: ci-sqlite-${{ runner.os }}-${{ runner.arch }}-3.53.4-${{ hashFiles('.github/scripts/build_sqlite.sh') }}
      - name: Build verified SQLite writer runtime
        if: steps.sqlite_cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash .github/scripts/build_sqlite.sh
      - name: Preload verified SQLite writer runtime
        shell: bash
        run: |
          set -euo pipefail
          sqlite_dir="$RUNNER_TEMP/sqlite-3.53.4"
          test -f "$sqlite_dir/libsqlite3.so.0"
          echo "LD_PRELOAD=$sqlite_dir/libsqlite3.so.0" >> "$GITHUB_ENV"
          LD_PRELOAD="$sqlite_dir/libsqlite3.so.0" python - <<'PY'
          import sqlite3

          assert sqlite3.sqlite_version == "3.53.4", sqlite3.sqlite_version
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e .[dev]
      - name: Run pytest
        run: python -m pytest -q -n 2 --dist=loadfile
