name: CI

# Quality-enforcement machinery for a repo with large pre-existing static debt.
# The debt is admitted explicitly through exact descending subsystem ceilings;
# every changed retained file must already be wholly clean:
#
#   * tests   — the FULL pytest suite must pass (the strong, whole-repo gate).
#   * quality — changed retained files must be wholly Ruff/format/suppression clean
#               only on what a PR touched, so new code stays clean while the
#               legacy baseline is paid down incrementally rather than blocking
#               every PR.
#
# The `typecheck` job scans every retained Python file and requires exact counts
# for Pyright diagnostics and inline suppressions. Improvements must lower their
# checked-in ceiling in the same PR, making each reduction durable.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Check Changed Paths
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
      python: ${{ steps.classify.outputs.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
            git cat-file -e "$base^{commit}"
            git cat-file -e "$head^{commit}"
            git diff --name-only --no-renames -z "$base...$head" \
              | python .github/scripts/ci_gate.py classify --github-output "$GITHUB_OUTPUT"
          elif git rev-parse --quiet --verify "$PUSH_BEFORE_SHA^{commit}" >/dev/null 2>&1; then
            git diff --name-only --no-renames -z "$PUSH_BEFORE_SHA" "$CURRENT_SHA" \
              | python .github/scripts/ci_gate.py classify --github-output "$GITHUB_OUTPUT"
          else
            git diff-tree --root --no-commit-id --name-only --no-renames -z -r "$CURRENT_SHA" \
              | python .github/scripts/ci_gate.py classify --github-output "$GITHUB_OUTPUT"
          fi

  public-boundary:
    name: Public Boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Reject private material in the published tree
        run: python execution/verify_public_tree.py

  fast-signal:
    name: Fast Signal
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Resolve python version for dependency cache key
        id: pyver
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Restore verified SQLite 3.53.4 writer runtime
        id: sqlite_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sqlite-3.53.4
          key: ci-sqlite-${{ runner.os }}-${{ runner.arch }}-3.53.4-${{ hashFiles('.github/scripts/build_sqlite.sh') }}
      - name: Build verified SQLite writer runtime
        if: steps.sqlite_cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash .github/scripts/build_sqlite.sh
      - name: Preload verified SQLite writer runtime
        shell: bash
        run: |
          set -euo pipefail
          sqlite_dir="$RUNNER_TEMP/sqlite-3.53.4"
          test -f "$sqlite_dir/libsqlite3.so.0"
          echo "LD_PRELOAD=$sqlite_dir/libsqlite3.so.0" >> "$GITHUB_ENV"
          LD_PRELOAD="$sqlite_dir/libsqlite3.so.0" python - <<'PY'
          import sqlite3

          assert sqlite3.sqlite_version == "3.53.4", sqlite3.sqlite_version
          PY
      - name: Restore pip dependency environment
        id: venv_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ci-venv
          key: ci-venv-${{ runner.os }}-py${{ steps.pyver.outputs.version }}-lock${{ hashFiles('requirements.lock') }}-pyproject${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        if: steps.venv_cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ci-venv/bin/pip" install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/ci-venv/bin/pip" install -e .[dev]
      - name: Activate dependency environment
        shell: bash
        run: echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Run fixed fail-closed and import signal
        run: >-
          PYTHONPATH=src pytest -q -n 0
          tests/test_smoke.py
          tests/test_ci_gate.py
          tests/test_filing_xbrl_bridge.py
          tests/test_filing_xbrl_normalization_rejection.py
          tests/test_sec_filing_xbrl_ingest_guards.py
          tests/test_sec_filing_xbrl_manifest_binding.py

  tests:
    name: tests (shard ${{ matrix.label }}/8)
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    # 40, not 25: the heaviest shards legitimately run 14-15 min, and hosted
    # runners routinely deliver ~2x slowdowns (disk/CPU contention), which put
    # shard 6 over a 25 min cap three times on 2026-07-31 while it was still
    # PASSING — every dot green, just slow. A timeout kill is reported as
    # `cancelled`, not `failure`, so it reads like a concurrency supersession
    # and costs a rerun to diagnose. 40 keeps ~2.5x headroom over the worst
    # observed honest run while still bounding a genuine hang.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Test files are assigned to these 13 shards by deterministic
        # duration-aware packing (not hand-maintained modulo splits): the
        # checked-in .github/test-durations.json pins every known file to a
        # shard and supplies its measured duration, so a file whose cost did
        # not change never moves shards. Only new (unpinned) files receive a
        # deterministic least-loaded default shard. The labels are the CI
        # surface — the job count and names are stable, and the aggregate gate
        # keys on the whole `tests` job, so the packer can rebalance freely
        # without touching this list (the helper refuses a table whose labels
        # drift from it). Setup is env-cached: the hash-verified SQLite runtime
        # and the pip dependency environment are exact-key cached per runner OS
        # / tool version / lock hash; any miss falls back to the full build and
        # install below.
        include:
          - { label: "1" }
          - { label: "1 overflow" }
          - { label: "2" }
          - { label: "2 overflow" }
          - { label: "3" }
          - { label: "3 overflow" }
          - { label: "4" }
          - { label: "5" }
          - { label: "6" }
          - { label: "6 overflow" }
          - { label: "7" }
          - { label: "8" }
          - { label: "8 overflow" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          # Deletion governance verifies every cataloged rollback blob, not
          # only the audited-head ancestry. Those recovery commits outlive any
          # fixed cleanup window, so the test job requires complete history.
          fetch-depth: 0
      - name: Materialize immutable historical test evidence
        shell: bash
        run: |
          set -euo pipefail
          # The replay denominator is an immutable historical blob. Resolve it
          # during setup so the test does not need the network in a partial clone.
          git cat-file blob 3cab2fae6f728fd74bef6d0c241d906c4b8c9798 >/dev/null # pragma: allowlist secret
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Resolve python version for dependency cache key
        id: pyver
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Restore verified SQLite 3.53.4 writer runtime
        id: sqlite_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sqlite-3.53.4
          # Exact key ONLY — deliberately no restore-keys. The key is the
          # runner OS, the SQLite version, and the hash of the build recipe
          # (the shared build script), so a fuzzy restore can never pair
          # a stale binary with a fresh workflow. On a miss the build step
          # below runs exactly as before; on a hit this shard skips it.
          key: ci-sqlite-${{ runner.os }}-${{ runner.arch }}-3.53.4-${{ hashFiles('.github/scripts/build_sqlite.sh') }}
      - name: Build verified SQLite writer runtime
        if: steps.sqlite_cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash .github/scripts/build_sqlite.sh
      - name: Preload verified SQLite writer runtime
        # Runs on both paths: the built artifact and the cached one must prove
        # they load as SQLite 3.53.4 before any shard touches the database.
        shell: bash
        run: |
          set -euo pipefail
          sqlite_dir="$RUNNER_TEMP/sqlite-3.53.4"
          test -f "$sqlite_dir/libsqlite3.so.0"
          echo "LD_PRELOAD=$sqlite_dir/libsqlite3.so.0" >> "$GITHUB_ENV"
          LD_PRELOAD="$sqlite_dir/libsqlite3.so.0" python - <<'PY'
          import sqlite3

          assert sqlite3.sqlite_version == "3.53.4", sqlite3.sqlite_version
          PY
      - name: Restore pip dependency environment
        id: venv_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ci-venv
          # Exact key ONLY — no restore-keys. The resolved interpreter version
          # plus the pinned lock hash and pyproject extras fully determine the
          # install, so a mismatch is a plain miss and falls back to the full
          # install below (never a silently older dependency set).
          key: ci-venv-${{ runner.os }}-py${{ steps.pyver.outputs.version }}-lock${{ hashFiles('requirements.lock') }}-pyproject${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        if: steps.venv_cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ci-venv/bin/pip" install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/ci-venv/bin/pip" install -e .[dev]
      - name: Activate dependency environment
        shell: bash
        run: echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      # tests/conftest.py creates one migrated template per worker and clones
      # disposable databases for tests. The checkout data/portfolio.db is never
      # bootstrapped or used as a test/live authority.
      - name: Run test-suite shard
        shell: bash
        run: |
          set -euo pipefail
          # The browser canary has one authoritative owner below: Browser
          # Security, which installs the hash-locked Playwright adapter.
          mapfile -t all_files < <(
            find tests -type f -name 'test_*.py' \
              | grep -v '^tests/test_browser_security_canary.py$' \
              | sort
          )
          mapfile -t selected < <(
            printf '%s\n' "${all_files[@]}" |
              python .github/scripts/ci_gate.py select-tests \
                --shard-label '${{ matrix.label }}' \
                --durations-file .github/test-durations.json
          )
          if (( ${#selected[@]} == 0 )); then
            echo "::error::test shard ${{ matrix.label }} selected no files"
            exit 1
          fi
          printf 'Shard %s/8: %s files\n' '${{ matrix.label }}' "${#selected[@]}"
          # --durations: `pytest -q` emits only dots, so when a shard stalls the
          # log shows a multi-minute gap between two dot rows and NOTHING about
          # which test caused it (this is what made the 2026-07-31 shard-6 kills
          # undiagnosable). The slowest-test table costs nothing and makes the
          # next occurrence attributable.
          pytest -q -n 2 --dist=loadfile --durations=25 \
            --junitxml="$RUNNER_TEMP/test-shard.xml" "${selected[@]}"
      - name: Upload per-file shard timings
        # Per-testcase times regenerate .github/test-durations.json from real
        # CI measurements (ci_gate.py durations-from-junit) instead of samples.
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-shard-timings-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test-shard.xml
          if-no-files-found: ignore
          retention-days: 7

  browser-security:
    name: Browser Security
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-browser.lock
      - name: Resolve python version for dependency cache key
        id: pyver
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Restore verified SQLite 3.53.4 writer runtime
        id: sqlite_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sqlite-3.53.4
          # Same exact-key contract as the tests job: runner OS + SQLite
          # version + build recipe hash, no restore-keys. On a hit the build
          # step below is skipped; the preload step still proves the runtime.
          key: ci-sqlite-${{ runner.os }}-${{ runner.arch }}-3.53.4-${{ hashFiles('.github/scripts/build_sqlite.sh') }}
      - name: Build verified SQLite writer runtime
        if: steps.sqlite_cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash .github/scripts/build_sqlite.sh
      - name: Preload verified SQLite writer runtime
        shell: bash
        run: |
          set -euo pipefail
          sqlite_dir="$RUNNER_TEMP/sqlite-3.53.4"
          test -f "$sqlite_dir/libsqlite3.so.0"
          echo "LD_PRELOAD=$sqlite_dir/libsqlite3.so.0" >> "$GITHUB_ENV"
          LD_PRELOAD="$sqlite_dir/libsqlite3.so.0" python - <<'PY'
          import sqlite3

          assert sqlite3.sqlite_version == "3.53.4", sqlite3.sqlite_version
          PY
      - name: Restore pip dependency environment
        id: venv_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ci-venv
          # Exact key only: resolved interpreter, both pinned lock hashes, and
          # the pyproject extras fully determine the install. Playwright's
          # Chromium download is deliberately NOT part of this cache — the
          # browser lives in ~/.cache/ms-playwright, so it is installed by its
          # own always-run step below on every run.
          key: ci-venv-${{ runner.os }}-py${{ steps.pyver.outputs.version }}-lock${{ hashFiles('requirements.lock') }}-browser${{ hashFiles('requirements-browser.lock') }}-pyproject${{ hashFiles('pyproject.toml') }}
      - name: Install runtime dependencies
        if: steps.venv_cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/pip" install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/ci-venv/bin/pip" install --require-hashes -r requirements-browser.lock
          "$RUNNER_TEMP/ci-venv/bin/pip" install -e .[dev]
      - name: Activate dependency environment
        shell: bash
        run: echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Install Playwright chromium shell
        # Always runs: the browser is cached separately (or absent on a fresh
        # runner), independent of the venv cache above.
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          python -m playwright install --with-deps --only-shell chromium
      - name: Verify browser security boundaries with isolated synthetic state
        run: python -m pytest -q -n 0 tests/test_browser_security_canary.py --basetemp="$RUNNER_TEMP/browser-security-canary"

  quality:
    needs: [changes]
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Resolve python version for dependency cache key
        id: pyver
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Restore pip dependency environment
        id: venv_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ci-venv
          key: ci-venv-${{ runner.os }}-py${{ steps.pyver.outputs.version }}-lock${{ hashFiles('requirements.lock') }}-pyproject${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        if: steps.venv_cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ci-venv/bin/pip" install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/ci-venv/bin/pip" install -e .[dev]
      - name: Activate dependency environment
        shell: bash
        run: echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Refresh the quality scanner
        # The old uncached job resolved current Ruff on every run. Preserve
        # that behavior on cache hits instead of hiding new scanner findings.
        run: python -m pip install --upgrade ruff
      - name: LLM eval coverage - no new registered gaps
        # Provider-free registry check: adding a purpose to either LLM_MODELS
        # or prompt_versions must include a real quality eval in the same PR.
        # Existing uncovered purposes are explicit debt and cannot grow.
        run: python execution/run_llm_evals.py --coverage-gate --repo-root .
      - name: Compute changed Python files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if ! git rev-parse --quiet --verify "$base^{commit}" >/dev/null 2>&1; then
              base="HEAD~1"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Check changed retained files with the shared local gate
        run: PYTHONPATH=src python -m quality.check_changed --base "${{ steps.changed.outputs.base }}" --mode committed --check format --check lint --check suppressions
      - name: Architecture boundary seams and ratchets
        # Receipt-based anti-sprawl gate next to the boundary seam check: a new
        # module, LOC bucket growth, fan-out growth, or new duplicated LOC fails
        # until the baseline receipt is deliberately re-measured in the same
        # reviewed change (scanner drift holds the gate, never passes it).
        run: |
          python scripts/check_architecture_boundaries.py
          PYTHONPATH=src python scripts/check_architecture_ratchet.py

  typecheck:
    needs: [changes]
    if: ${{ needs.changes.outputs.python == 'true' }}
    # Every changed retained file must be clean. The complete active population
    # also has exact, checked-in subsystem ceilings that must move downward with
    # each debt cleanup; hidden files and diagnostic substitution cannot pass.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        # Runtime deps make third-party imports resolve. First-party modules
        # resolve through [tool.pyright].extraPaths.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          # Install the IR typing extra as well as the runtime lock. The static
          # ceiling must not change according to whether an optional package
          # happens to be present on the machine running the gate.
          pip install "pyright==1.1.414" "pytest>=8" "alembic>=1.13" "sqlalchemy>=2.0" "playwright>=1.48"
      - name: Resolve base ref
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if ! git rev-parse --quiet --verify "$base^{commit}" >/dev/null 2>&1; then
              base="HEAD~1"
            fi
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: pyright strict — changed retained files are wholly clean
        env:
          CHECK_BASE: ${{ steps.base.outputs.ref }}
        run: PYTHONPATH=src python -m quality.check_changed --base "$CHECK_BASE" --mode committed --check types
      - name: pyright and suppression ceilings — complete active population is exact
        run: PYTHONPATH=src python execution/enforce_static_quality.py --pythonpath "$(command -v python)" --base "${{ steps.base.outputs.ref }}" --failure-diagnostics

  security:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    # Blocking supply-chain, secret, and SAST checks. Bandit carries an explicit
    # reviewed legacy baseline so regressions fail without pretending the
    # historical findings have already been remediated.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-browser.lock
      - name: Install scanners + runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pip-audit bandit cyclonedx-bom detect-secrets==1.5.0
      - name: pip-audit — dependency CVEs
        id: pip_audit
        continue-on-error: true
        run: |
          pip-audit -r requirements.lock --progress-spinner off
          pip-audit -r requirements-browser.lock --progress-spinner off
      - name: bandit — no new medium+ SAST findings
        id: bandit
        continue-on-error: true
        run: bandit -q -r src execution -ll -b .bandit-baseline.json
      # Each tracked (path, blob) pair is scanned unless a trusted main push
      # run already proved that exact pair clean with the same detector,
      # arguments and filter. Pull requests read that cache but never save it.
      - name: Restore detect-secrets clean-file cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/secret-scan-cache.json
          key: secret-scan-v1-${{ github.sha }}
          restore-keys: secret-scan-v1-
      - name: detect-secrets - no new credential material
        id: detect_secrets
        continue-on-error: true
        shell: bash
        env:
          TRUSTED_CACHE_WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          write=()
          if [ "$TRUSTED_CACHE_WRITE" = "true" ]; then write=(--write-cache); fi
          python .github/scripts/leak_scan.py \
            --cache "$RUNNER_TEMP/secret-scan-cache.json" --jobs "$(nproc)" "${write[@]}"
      - name: Save detect-secrets clean-file cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.detect_secrets.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/secret-scan-cache.json
          key: secret-scan-v1-${{ github.sha }}
      - name: Generate CycloneDX SBOM
        id: sbom
        continue-on-error: true
        run: |
          cyclonedx-py requirements requirements.lock --output-file sbom-runtime.cdx.json
          cyclonedx-py requirements requirements-browser.lock --output-file sbom-browser.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && hashFiles('sbom-*.cdx.json') != '' }}
        with:
          name: cyclonedx-sbom
          path: sbom-*.cdx.json
      - name: Require every security scanner to pass
        if: ${{ always() }}
        env:
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          DETECT_SECRETS_OUTCOME: ${{ steps.detect_secrets.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for result in \
            "$PIP_AUDIT_OUTCOME" \
            "$BANDIT_OUTCOME" \
            "$DETECT_SECRETS_OUTCOME" \
            "$SBOM_OUTCOME"; do
            if [ "$result" != "success" ]; then
              status=1
            fi
          done
          exit "$status"

  windows-app:
    name: Native Windows Application Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    # The application's own harness (conftest, migrated fixture databases, the
    # vendored hash-verified SQLite DLL) on a disposable hosted Windows VM, for
    # code whose behavior differs on Windows: storage reservation, job-runtime
    # locks and process liveness, retained owner approvals, and
    # the cockpit cache, plus proof that the session bound the vendored DLL.
    # The production host is never used as a test runner. verify-windows-app
    # requires every file and every named case in WINDOWS_APP_REQUIRED_CASES.
    timeout-minutes: 30
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Resolve python version for dependency cache key
        id: pyver
        shell: pwsh
        run: |
          $version = python -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Restore locked Windows test environment
        id: windows_venv_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/app-venv
          key: ci-windows-app-${{ runner.os }}-${{ runner.arch }}-py${{ steps.pyver.outputs.version }}-lock${{ hashFiles('requirements.lock') }}-pyproject${{ hashFiles('pyproject.toml') }}-recipe${{ hashFiles('.github/scripts/install_windows_app.ps1') }}
      - name: Install locked application and test dependencies
        if: steps.windows_venv_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./.github/scripts/install_windows_app.ps1
      - name: Verify restored Windows test dependencies
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/app-venv/Scripts/python.exe" -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows-relevant application tests with the repository harness
        shell: pwsh
        env:
          # Hosted Windows system temp is on C:, where each SQLite commit
          # flushes to a slow OS disk: 500 commits took 14.46 s there versus
          # 0.40 s on RUNNER_TEMP (D:) in run 45001415371. Keeping the test
          # databases on D: cut this step from 183-255 s to 62 s with all 338
          # cases passing. Durability semantics are unchanged.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          & "$env:RUNNER_TEMP/app-venv/Scripts/python.exe" -m pytest -q -p no:cacheprovider --durations=25 --junitxml="$env:RUNNER_TEMP/native-app.xml" `
            tests/test_storage_reservation.py `
            tests/test_job_runtime.py `
            tests/test_owner_proposal_approval.py `
            tests/test_cockpit_fundamentals.py `
            tests/test_sqlite_bootstrap.py `
            tests/test_dcf_retained_availability.py `
            tests/test_dcf_canonical_statements.py `
            tests/test_redesign_input_evidence.py `
            tests/test_redesign_workbook_evidence.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/ci_gate.py verify-windows-app --junit "$env:RUNNER_TEMP/native-app.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: native-windows-app
          path: ${{ runner.temp }}/native-app.xml
          if-no-files-found: error
          retention-days: 7

  windows-native:
    name: Native Windows Process Tree
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install isolated native-test dependencies
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/native-venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/native-venv/Scripts/python.exe" -m pip install "pytest>=8" "defusedxml==0.7.1" "pydantic==2.13.4"
      - name: Exercise original native Windows cases without application fixtures
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/native-venv/Scripts/python.exe" -m pytest -q --noconftest --basetemp="$env:RUNNER_TEMP/native-process-tree" --junitxml="$env:RUNNER_TEMP/native-process-tree.xml" `
            "tests/test_job_runtime_process_tree.py::test_windows_exited_process_with_held_handle_is_dead_and_lock_is_recoverable[0]" `
            "tests/test_job_runtime_process_tree.py::test_windows_exited_process_with_held_handle_is_dead_and_lock_is_recoverable[259]" `
            tests/test_job_runtime_process_tree.py::test_windows_kill_on_close_job_terminates_process_and_descendant `
            tests/test_job_runtime_process_tree.py::test_managed_child_is_suspended_assigned_resumed_and_kills_descendant `
            tests/test_job_runtime_process_tree.py::test_managed_deadline_kills_live_worker_and_descendant `
            tests/test_storage_reservation.py::test_concurrent_processes_cannot_both_admit_over_host_limit `
            tests/test_storage_reservation.py::test_dead_holder_lease_is_reclaimed_at_admission `
            tests/test_storage_reservation.py::test_live_holder_lease_is_never_reclaimed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/ci_gate.py verify-windows-native --junit "$env:RUNNER_TEMP/native-process-tree.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: native-windows-process-tree
          path: ${{ runner.temp }}/native-process-tree.xml
          if-no-files-found: error
          retention-days: 7

  merge-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, public-boundary, fast-signal, windows-native, windows-app, tests, browser-security, quality, typecheck, security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Require every applicable job to pass
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code || 'false' }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python || 'false' }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          PUBLIC_BOUNDARY_RESULT: ${{ needs.public-boundary.result }}
          FAST_SIGNAL_RESULT: ${{ needs.fast-signal.result }}
          WINDOWS_NATIVE_RESULT: ${{ needs.windows-native.result }}
          WINDOWS_APP_RESULT: ${{ needs.windows-app.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BROWSER_SECURITY_RESULT: ${{ needs.browser-security.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: >-
          python .github/scripts/ci_gate.py verify
          --code "$CODE_CHANGED"
          --python "$PYTHON_CHANGED"
          --changes-result "$CHANGES_RESULT"
          --public-boundary-result "$PUBLIC_BOUNDARY_RESULT"
          --fast-signal-result "$FAST_SIGNAL_RESULT"
          --windows-native-result "$WINDOWS_NATIVE_RESULT"
          --windows-app-result "$WINDOWS_APP_RESULT"
          --tests-result "$TESTS_RESULT"
          --browser-security-result "$BROWSER_SECURITY_RESULT"
          --quality-result "$QUALITY_RESULT"
          --typecheck-result "$TYPECHECK_RESULT"
          --security-result "$SECURITY_RESULT"
