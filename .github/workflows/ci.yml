name: CI

# Quality-enforcement machinery for a repo with large pre-existing static debt.
# The debt is admitted explicitly through exact descending subsystem ceilings;
# every changed retained file must already be wholly clean:
#
#   * tests   — the FULL pytest suite must pass (the strong, whole-repo gate).
#   * quality — changed retained files must be wholly Ruff/format/suppression clean
#               only on what a PR touched, so new code stays clean while the
#               legacy baseline is paid down incrementally rather than blocking
#               every PR.
#
# The `typecheck` job scans every retained Python file and requires exact counts
# for Pyright diagnostics and inline suppressions. Improvements must lower their
# checked-in ceiling in the same PR, making each reduction durable.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly Design Sync safety net (declared new scope, workstream C1): the
    # design job's `if:` runs it on this trigger even when the classifier found
    # no design path, so a missed cross-surface coupling in a PR is caught
    # within a day. The `changes` job requires no path group on schedule, so
    # every other conditional job skips and the nightly run stays cheap.
    - cron: "17 6 * * *"

concurrency:
  # The event name keeps the nightly schedule run (ref = refs/heads/main) in
  # its own group so it can never cancel an in-progress main-push run (and is
  # itself cancelled by one — that push runs the design job anyway). PR and
  # push cancellation semantics are unchanged by the suffix.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Check Changed Paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      python: ${{ steps.classify.outputs.python }}
      design: ${{ steps.classify.outputs.design }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            # The nightly trigger exists solely for the scheduled Design Sync
            # run (the design job's `if:` names it); it must not fan out the
            # expensive matrix, so no path group is required and every other
            # conditional job skips.
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "design=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
            git cat-file -e "$base^{commit}"
            git cat-file -e "$head^{commit}"
            git diff --name-only --no-renames -z "$base...$head" \
              | python .github/scripts/ci_gate.py classify --github-output "$GITHUB_OUTPUT"
          elif git rev-parse --quiet --verify "$PUSH_BEFORE_SHA^{commit}" >/dev/null 2>&1; then
            git diff --name-only --no-renames -z "$PUSH_BEFORE_SHA" "$CURRENT_SHA" \
              | python .github/scripts/ci_gate.py classify --github-output "$GITHUB_OUTPUT"
          else
            git diff-tree --root --no-commit-id --name-only --no-renames -z -r "$CURRENT_SHA" \
              | python .github/scripts/ci_gate.py classify --github-output "$GITHUB_OUTPUT"
          fi

  public-boundary:
    name: Public Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Reject private material in the published tree
        run: python execution/verify_public_tree.py

  fast-signal:
    name: Fast Signal
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Resolve python version for dependency cache key
        id: pyver
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Restore verified SQLite 3.53.4 writer runtime
        id: sqlite_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sqlite-3.53.4
          key: ci-sqlite-${{ runner.os }}-3.53.4-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Build verified SQLite writer runtime
        if: steps.sqlite_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sqlite_dir="$RUNNER_TEMP/sqlite-3.53.4"
          archive="$RUNNER_TEMP/sqlite-amalgamation-3530400.zip"
          mkdir -p "$sqlite_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip \
            --output "$archive"
          python - "$archive" <<'PY'
          import hashlib
          import pathlib
          import sys

          expected = "628a44cfe82c66aed1ccbbe85a562d2e33ebe64b3288981ed76285612227934e"
          observed = hashlib.sha3_256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          if observed != expected:
              raise SystemExit(f"SQLite archive SHA3-256 mismatch: {observed}")
          PY
          unzip -q "$archive" -d "$sqlite_dir"
          gcc -O2 -fPIC -shared -pthread -DSQLITE_ENABLE_FTS5 \
            "$sqlite_dir/sqlite-amalgamation-3530400/sqlite3.c" \
            -o "$sqlite_dir/libsqlite3.so.0" -lm -ldl
      - name: Preload verified SQLite writer runtime
        shell: bash
        run: |
          set -euo pipefail
          sqlite_dir="$RUNNER_TEMP/sqlite-3.53.4"
          test -f "$sqlite_dir/libsqlite3.so.0"
          echo "LD_PRELOAD=$sqlite_dir/libsqlite3.so.0" >> "$GITHUB_ENV"
          LD_PRELOAD="$sqlite_dir/libsqlite3.so.0" python - <<'PY'
          import sqlite3

          assert sqlite3.sqlite_version == "3.53.4", sqlite3.sqlite_version
          PY
      - name: Restore pip dependency environment
        id: venv_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ci-venv
          key: ci-venv-${{ runner.os }}-py${{ steps.pyver.outputs.version }}-lock${{ hashFiles('requirements.lock') }}-pyproject${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        if: steps.venv_cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ci-venv/bin/pip" install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/ci-venv/bin/pip" install -e .[dev]
      - name: Activate dependency environment
        shell: bash
        run: echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Run fixed fail-closed and import signal
        run: >-
          PYTHONPATH=src pytest -q -n 0
          tests/test_smoke.py
          tests/test_ci_gate.py
          tests/test_filing_xbrl_bridge.py
          tests/test_filing_xbrl_normalization_rejection.py
          tests/test_sec_filing_xbrl_ingest_guards.py
          tests/test_sec_filing_xbrl_manifest_binding.py

  tests:
    name: tests (shard ${{ matrix.label }}/8)
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # 40, not 25: the heaviest shards legitimately run 14-15 min, and hosted
    # runners routinely deliver ~2x slowdowns (disk/CPU contention), which put
    # shard 6 over a 25 min cap three times on 2026-07-31 while it was still
    # PASSING — every dot green, just slow. A timeout kill is reported as
    # `cancelled`, not `failure`, so it reads like a concurrency supersession
    # and costs a rerun to diagnose. 40 keeps ~2.5x headroom over the worst
    # observed honest run while still bounding a genuine hang.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Test files are assigned to these 13 shards by deterministic
        # duration-aware packing (not hand-maintained modulo splits): the
        # checked-in .github/test-durations.json pins every known file to a
        # shard and supplies its measured duration, so a file whose cost did
        # not change never moves shards. Only new (unpinned) files receive a
        # deterministic least-loaded default shard. The labels are the CI
        # surface — the job count and names are stable, and the aggregate gate
        # keys on the whole `tests` job, so the packer can rebalance freely
        # without touching this list (the helper refuses a table whose labels
        # drift from it). Setup is env-cached: the hash-verified SQLite runtime
        # and the pip dependency environment are exact-key cached per runner OS
        # / tool version / lock hash; any miss falls back to the full build and
        # install below.
        include:
          - { label: "1" }
          - { label: "1 overflow" }
          - { label: "2" }
          - { label: "2 overflow" }
          - { label: "3" }
          - { label: "3 overflow" }
          - { label: "4" }
          - { label: "5" }
          - { label: "6" }
          - { label: "6 overflow" }
          - { label: "7" }
          - { label: "8" }
          - { label: "8 overflow" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Deletion governance verifies every cataloged rollback blob, not
          # only the audited-head ancestry. Those recovery commits outlive any
          # fixed cleanup window, so the test job requires complete history.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Resolve python version for dependency cache key
        id: pyver
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Restore verified SQLite 3.53.4 writer runtime
        id: sqlite_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sqlite-3.53.4
          # Exact key ONLY — deliberately no restore-keys. The key is the
          # runner OS, the SQLite version, and the hash of the build recipe
          # (which lives in this workflow), so a fuzzy restore can never pair
          # a stale binary with a fresh workflow. On a miss the build step
          # below runs exactly as before; on a hit this shard skips it.
          key: ci-sqlite-${{ runner.os }}-3.53.4-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Build verified SQLite writer runtime
        if: steps.sqlite_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sqlite_dir="$RUNNER_TEMP/sqlite-3.53.4"
          archive="$RUNNER_TEMP/sqlite-amalgamation-3530400.zip"
          mkdir -p "$sqlite_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip \
            --output "$archive"
          python - "$archive" <<'PY'
          import hashlib
          import pathlib
          import sys

          expected = "628a44cfe82c66aed1ccbbe85a562d2e33ebe64b3288981ed76285612227934e"
          observed = hashlib.sha3_256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          if observed != expected:
              raise SystemExit(f"SQLite archive SHA3-256 mismatch: {observed}")
          PY
          unzip -q "$archive" -d "$sqlite_dir"
          gcc -O2 -fPIC -shared -pthread -DSQLITE_ENABLE_FTS5 \
            "$sqlite_dir/sqlite-amalgamation-3530400/sqlite3.c" \
            -o "$sqlite_dir/libsqlite3.so.0" -lm -ldl
      - name: Preload verified SQLite writer runtime
        # Runs on both paths: the built artifact and the cached one must prove
        # they load as SQLite 3.53.4 before any shard touches the database.
        shell: bash
        run: |
          set -euo pipefail
          sqlite_dir="$RUNNER_TEMP/sqlite-3.53.4"
          test -f "$sqlite_dir/libsqlite3.so.0"
          echo "LD_PRELOAD=$sqlite_dir/libsqlite3.so.0" >> "$GITHUB_ENV"
          LD_PRELOAD="$sqlite_dir/libsqlite3.so.0" python - <<'PY'
          import sqlite3

          assert sqlite3.sqlite_version == "3.53.4", sqlite3.sqlite_version
          PY
      - name: Restore pip dependency environment
        id: venv_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ci-venv
          # Exact key ONLY — no restore-keys. The resolved interpreter version
          # plus the pinned lock hash and pyproject extras fully determine the
          # install, so a mismatch is a plain miss and falls back to the full
          # install below (never a silently older dependency set).
          key: ci-venv-${{ runner.os }}-py${{ steps.pyver.outputs.version }}-lock${{ hashFiles('requirements.lock') }}-pyproject${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        if: steps.venv_cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ci-venv/bin/pip" install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/ci-venv/bin/pip" install -e .[dev]
      - name: Activate dependency environment
        shell: bash
        run: echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      # tests/conftest.py creates one migrated template per worker and clones
      # disposable databases for tests. The checkout data/portfolio.db is never
      # bootstrapped or used as a test/live authority.
      - name: Run test-suite shard
        shell: bash
        run: |
          set -euo pipefail
          # Browser canaries have one authoritative owner below: Design Sync,
          # which installs the hash-locked Playwright adapter and Chromium.
          mapfile -t all_files < <(
            find tests -type f -name 'test_*.py' \
              | grep -v '^tests/test_design_computed_canary.py$' \
              | grep -v '^tests/test_browser_security_canary.py$' \
              | sort
          )
          mapfile -t selected < <(
            printf '%s\n' "${all_files[@]}" |
              python .github/scripts/ci_gate.py select-tests \
                --shard-label '${{ matrix.label }}' \
                --durations-file .github/test-durations.json
          )
          if (( ${#selected[@]} == 0 )); then
            echo "::error::test shard ${{ matrix.label }} selected no files"
            exit 1
          fi
          printf 'Shard %s/8: %s files\n' '${{ matrix.label }}' "${#selected[@]}"
          # --durations: `pytest -q` emits only dots, so when a shard stalls the
          # log shows a multi-minute gap between two dot rows and NOTHING about
          # which test caused it (this is what made the 2026-07-31 shard-6 kills
          # undiagnosable). The slowest-test table costs nothing and makes the
          # next occurrence attributable.
          pytest -q -n 2 --dist=loadfile --durations=25 "${selected[@]}"

  design:
    name: Design Sync
    needs: [changes]
    # Runs for a PR that touched a design path (classifier output), for every
    # push to main, and for the nightly schedule trigger. A PR with no design
    # path skips the job, and the aggregate gate tolerates that skip only
    # because classify_paths said design=false.
    if: ${{ needs.changes.outputs.design == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-design.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - name: Resolve python version for dependency cache key
        id: pyver
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Restore verified SQLite 3.53.4 writer runtime
        id: sqlite_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sqlite-3.53.4
          # Same exact-key contract as the tests job: runner OS + SQLite
          # version + build recipe hash, no restore-keys. On a hit the build
          # step below is skipped; the preload step still proves the runtime.
          key: ci-sqlite-${{ runner.os }}-3.53.4-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Build verified SQLite writer runtime
        if: steps.sqlite_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sqlite_dir="$RUNNER_TEMP/sqlite-3.53.4"
          archive="$RUNNER_TEMP/sqlite-amalgamation-3530400.zip"
          mkdir -p "$sqlite_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip \
            --output "$archive"
          python - "$archive" <<'PY'
          import hashlib
          import pathlib
          import sys

          expected = "628a44cfe82c66aed1ccbbe85a562d2e33ebe64b3288981ed76285612227934e"
          observed = hashlib.sha3_256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          if observed != expected:
              raise SystemExit(f"SQLite archive SHA3-256 mismatch: {observed}")
          PY
          unzip -q "$archive" -d "$sqlite_dir"
          gcc -O2 -fPIC -shared -pthread -DSQLITE_ENABLE_FTS5 \
            "$sqlite_dir/sqlite-amalgamation-3530400/sqlite3.c" \
            -o "$sqlite_dir/libsqlite3.so.0" -lm -ldl
      - name: Preload verified SQLite writer runtime
        shell: bash
        run: |
          set -euo pipefail
          sqlite_dir="$RUNNER_TEMP/sqlite-3.53.4"
          test -f "$sqlite_dir/libsqlite3.so.0"
          echo "LD_PRELOAD=$sqlite_dir/libsqlite3.so.0" >> "$GITHUB_ENV"
          LD_PRELOAD="$sqlite_dir/libsqlite3.so.0" python - <<'PY'
          import sqlite3

          assert sqlite3.sqlite_version == "3.53.4", sqlite3.sqlite_version
          PY
      - name: Restore pip dependency environment
        id: venv_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ci-venv
          # Exact key only: resolved interpreter, both pinned lock hashes, and
          # the pyproject extras fully determine the install. Playwright's
          # Chromium download is deliberately NOT part of this cache — the
          # browser lives in ~/.cache/ms-playwright, so it is installed by its
          # own always-run step below on every run.
          key: ci-venv-${{ runner.os }}-py${{ steps.pyver.outputs.version }}-lock${{ hashFiles('requirements.lock') }}-design${{ hashFiles('requirements-design.lock') }}-pyproject${{ hashFiles('pyproject.toml') }}
      - name: Install runtime dependencies
        if: steps.venv_cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/pip" install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/ci-venv/bin/pip" install --require-hashes -r requirements-design.lock
          "$RUNNER_TEMP/ci-venv/bin/pip" install -e .[dev]
      - name: Activate dependency environment
        shell: bash
        run: echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Install Playwright chromium shell
        # Always runs: the browser is cached separately (or absent on a fresh
        # runner), independent of the venv cache above.
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Verify canonical design tokens and production Work OS contract
        env:
          # gen_design_conformance_debt.py REFUSES --allow-missing-base with an
          # empty --base-ref, which a schedule event (no PR base, no before)
          # would otherwise produce — so the nightly run compares against
          # HEAD~1 ("did the last commit grow design debt") instead.
          DESIGN_DEBT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: |
          python scripts/check_design_sync.py
          python scripts/gen_design_conformance_debt.py --base-ref "$DESIGN_DEBT_BASE_REF" --allow-missing-base
      - name: Verify React component types and visual token purity
        working-directory: design-system
        run: |
          npm ci
          npm run check
      - name: Run mandatory rendered route canary matrix
        run: |
          # The CLI owns the single full 9-route x 2-viewport matrix. Unit
          # tests retain the positive and adversarial browser checks without
          # paying for that matrix a second time.
          python -m pytest -q tests/test_design_computed_canary.py -k "not route_canary_matrix_covers_all_required_routes_and_viewports"
          python execution/verify_design_conformance.py --check --route-canaries
      - name: Verify browser security boundaries with isolated synthetic state
        run: python -m pytest -q -n 0 tests/test_browser_security_canary.py --basetemp="$RUNNER_TEMP/browser-security-canary"

  quality:
    needs: [changes]
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install ruff
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e .[dev]
      - name: LLM eval coverage - no new registered gaps
        # Provider-free registry check: adding a purpose to either LLM_MODELS
        # or prompt_versions must include a real quality eval in the same PR.
        # Existing uncovered purposes are explicit debt and cannot grow.
        run: python execution/run_llm_evals.py --coverage-gate --repo-root .
      - name: Compute changed Python files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if ! git rev-parse --quiet --verify "$base^{commit}" >/dev/null 2>&1; then
              base="HEAD~1"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Check changed retained files with the shared local gate
        run: PYTHONPATH=src python -m quality.check_changed --base "${{ steps.changed.outputs.base }}" --mode committed --check format --check lint --check suppressions

  typecheck:
    needs: [changes]
    if: ${{ needs.changes.outputs.python == 'true' }}
    # Every changed retained file must be clean. The complete active population
    # also has exact, checked-in subsystem ceilings that must move downward with
    # each debt cleanup; hidden files and diagnostic substitution cannot pass.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        # Runtime deps make third-party imports resolve. First-party modules
        # resolve through [tool.pyright].extraPaths.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          # Install the IR typing extra as well as the runtime lock. The static
          # ceiling must not change according to whether an optional package
          # happens to be present on the machine running the gate.
          pip install "pyright==1.1.414" "pytest>=8" "alembic>=1.13" "sqlalchemy>=2.0" "playwright>=1.48"
      - name: Resolve base ref
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if ! git rev-parse --quiet --verify "$base^{commit}" >/dev/null 2>&1; then
              base="HEAD~1"
            fi
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: pyright strict — changed retained files are wholly clean
        env:
          CHECK_BASE: ${{ steps.base.outputs.ref }}
        run: PYTHONPATH=src python -m quality.check_changed --base "$CHECK_BASE" --mode committed --check types
      - name: pyright and suppression ceilings — complete active population is exact
        run: PYTHONPATH=src python execution/enforce_static_quality.py --pythonpath "$(command -v python)" --base "${{ steps.base.outputs.ref }}"

  security:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    # Blocking supply-chain, secret, and SAST checks. Bandit carries an explicit
    # reviewed legacy baseline so regressions fail without pretending the
    # historical findings have already been remediated.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-design.lock
      - name: Install scanners + runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pip-audit bandit cyclonedx-bom detect-secrets==1.5.0
      - name: pip-audit — dependency CVEs
        id: pip_audit
        continue-on-error: true
        run: |
          pip-audit -r requirements.lock --progress-spinner off
          pip-audit -r requirements-design.lock --progress-spinner off
      - name: npm audit — design dependency CVEs
        id: npm_audit
        continue-on-error: true
        working-directory: design-system
        run: npm audit --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org
      - name: bandit — no new medium+ SAST findings
        id: bandit
        continue-on-error: true
        run: bandit -q -r src execution -ll -b .bandit-baseline.json
      # Canonical evidence hash fields are generated metadata. Keep scanning
      # every other field and file with the unchanged detector set.
      - name: detect-secrets - no new credential material
        id: detect_secrets
        continue-on-error: true
        shell: bash
        run: >-
          git ls-files -z |
          xargs -0 detect-secrets-hook
          --filter file://.github/scripts/quality_hash_filter.py::is_quality_evidence_hash
          --exclude-files
          '^(?:data[\\/]fmp_canary_manifest\.json|evals[\\/]receipts[\\/].*|docs[\\/]hardening[\\/].*|docs[\\/]quality[\\/](?:architecture-initial-09d35d1a|duplicates-initial-09d35d1a|static-baseline|compatibility-baseline)\.json|docs[\\/]quality[\\/]reachability-(?:dynamic-import|getattr|process)-dispositions\.json|config[\\/]filing_xbrl_processor_(?:approval|bundle)\.json|docs[\\/]design[\\/]deletion_catalog_2026_08\.json|evals[\\/]golden[\\/]metric_lifecycle_triage\.json|tests[\\/](?:test_etf_instrument_mvp|test_gemini_backend|test_peer_selection|test_validate_environment)\.py)$'
      - name: Generate CycloneDX SBOM
        id: sbom
        continue-on-error: true
        run: |
          cyclonedx-py requirements requirements.lock --output-file sbom-runtime.cdx.json
          cyclonedx-py requirements requirements-design.lock --output-file sbom-design.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && hashFiles('sbom-*.cdx.json') != '' }}
        with:
          name: cyclonedx-sbom
          path: sbom-*.cdx.json
      - name: Require every security scanner to pass
        if: ${{ always() }}
        env:
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.npm_audit.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          DETECT_SECRETS_OUTCOME: ${{ steps.detect_secrets.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for result in \
            "$PIP_AUDIT_OUTCOME" \
            "$NPM_AUDIT_OUTCOME" \
            "$BANDIT_OUTCOME" \
            "$DETECT_SECRETS_OUTCOME" \
            "$SBOM_OUTCOME"; do
            if [ "$result" != "success" ]; then
              status=1
            fi
          done
          exit "$status"

  merge-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, public-boundary, fast-signal, tests, design, quality, typecheck, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every applicable job to pass
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code || 'false' }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python || 'false' }}
          DESIGN_CHANGED: ${{ needs.changes.outputs.design || 'false' }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          PUBLIC_BOUNDARY_RESULT: ${{ needs.public-boundary.result }}
          FAST_SIGNAL_RESULT: ${{ needs.fast-signal.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DESIGN_RESULT: ${{ needs.design.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: >-
          python .github/scripts/ci_gate.py verify
          --code "$CODE_CHANGED"
          --python "$PYTHON_CHANGED"
          --design "$DESIGN_CHANGED"
          --changes-result "$CHANGES_RESULT"
          --public-boundary-result "$PUBLIC_BOUNDARY_RESULT"
          --fast-signal-result "$FAST_SIGNAL_RESULT"
          --tests-result "$TESTS_RESULT"
          --design-result "$DESIGN_RESULT"
          --quality-result "$QUALITY_RESULT"
          --typecheck-result "$TYPECHECK_RESULT"
          --security-result "$SECURITY_RESULT"
