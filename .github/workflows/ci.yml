name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-boundary:
    name: Public Boundary & Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify public tree boundary
        run: python execution/verify_public_tree.py
      - name: Run detect-secrets scan
        run: |
          pip install detect-secrets==1.5.0
          python .github/scripts/leak_scan.py --cache "${{ runner.temp }}/secret-scan-clean.json"

  quality:
    name: Format, Lint, Typecheck & Instructions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e .[dev]
      - name: Check formatting and lint
        run: |
          python -m ruff format --check --extend-exclude alembic/versions_archived .
          python -m ruff check .
      - name: Typecheck src/
        run: python -m pyright --pythonpath "$(which python)" src/
      - name: Validate directives, folder contract, and instruction tests
        run: |
          python execution/validate_directive_manifest.py
          python execution/validate_folder_contract.py
          python -m pytest -q instruction_tests
          .githooks/test_pre_push.sh

  tests:
    name: Test Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e .[dev]
      - name: Run pytest
        run: python -m pytest -q -n 2 --dist=loadfile
