name: Public Boundary

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  public-boundary:
    name: Public Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Reject private material in the published tree
        run: python execution/verify_public_tree.py
