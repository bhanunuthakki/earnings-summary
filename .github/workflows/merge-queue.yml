name: Merge Queue

# Serial full-suite merge gateway for this personal repository, which cannot
# use GitHub's native merge queue. Apply the `merge-queue` label to an open,
# same-repository pull request to enqueue its current head. The controller:
#
#   1. select   - trusted main code picks the oldest labelled entry and GitHub's
#                 test merge commit C whose parents are exactly [main B, head H].
#   2. ci       - main's ci.yml runs the COMPLETE suite on C with a read-only
#                 contents token, no secrets and read-only caches.
#   3. finalize - a fresh runner on trusted main code verifies the exact job
#                 inventory and that B, H and the label are unchanged, publishes
#                 the App-sourced `Queue Gate` status on C, then moves main from
#                 B to exactly C with an expected-old-value guard.
#
# A failed candidate is dequeued once and never rerun. Owner setup and the
# ruleset that makes `Queue Gate` mandatory: docs/quality/merge-queue.md.

on:
  pull_request_target:
    types: [labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One controller at a time; a newer trigger waits and rescans the complete
  # labelled set, so replacing a pending trigger never loses an entry.
  group: merge-queue
  cancel-in-progress: false

permissions: {}

jobs:
  select:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'pull_request_target' || github.event.label.name == 'merge-queue')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      found: ${{ steps.select.outputs.found }}
      pr: ${{ steps.select.outputs.pr }}
      head: ${{ steps.select.outputs.head }}
      base: ${{ steps.select.outputs.base }}
      merge: ${{ steps.select.outputs.merge }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the oldest eligible queue entry
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/merge_queue.py select

  ci:
    name: Full suite
    needs: [select]
    if: ${{ needs.select.outputs.found == 'true' }}
    cache-mode: read
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ needs.select.outputs.merge }}

  finalize:
    needs: [select, ci]
    if: ${{ always() && needs.select.outputs.found == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    cache-mode: none
    # The environment's deployment-branch policy admits only main, so a
    # dispatch of a modified branch copy cannot reach the App private key.
    environment: merge-queue
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: write
    env:
      QUEUE_PR: ${{ needs.select.outputs.pr }}
      QUEUE_HEAD: ${{ needs.select.outputs.head }}
      QUEUE_BASE: ${{ needs.select.outputs.base }}
      QUEUE_MERGE: ${{ needs.select.outputs.merge }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Mint the merge-queue App token
        id: app
        if: ${{ needs.ci.result == 'success' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MERGE_QUEUE_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_PRIVATE_KEY }}
          permission-contents: write
          permission-statuses: write
          permission-workflows: write
      - name: Verify the candidate and publish Queue Gate
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_QUEUE_APP_TOKEN: ${{ steps.app.outputs.token }}
          CI_RESULT: ${{ needs.ci.result }}
        run: python3 .github/scripts/merge_queue.py finalize --ci-result "$CI_RESULT"
      - name: Move main from the tested base to exactly the tested candidate
        if: ${{ steps.verify.outputs.push == 'true' }}
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin "$QUEUE_MERGE"
          test "$(git rev-parse "$QUEUE_MERGE^1")" = "$QUEUE_BASE"
          test "$(git rev-parse "$QUEUE_MERGE^2")" = "$QUEUE_HEAD"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="$header"
          git push --atomic --force-with-lease="refs/heads/main:$QUEUE_BASE" origin "$QUEUE_MERGE:refs/heads/main"
      - name: Close the queue entry
        if: ${{ steps.verify.outputs.push == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$QUEUE_PR/labels/merge-queue" --silent || true
          gh api "repos/$GITHUB_REPOSITORY/issues/$QUEUE_PR/comments" --silent \
            -f body="Merged by the queue as \`$QUEUE_MERGE\` after the complete suite passed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Continue with the next entry
        # A merge pushes main and triggers the next scan itself; otherwise
        # dispatch one so a dequeued failure does not stall later entries.
        if: ${{ always() && steps.verify.outcome == 'success' && steps.verify.outputs.push != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/merge_queue.py dispatch
