<!doctype html><html lang="en"><head><meta charset="utf-8"><style>:root{--fs-body:13px;--fs-caption:11px;--radius:8px;--radius-full:999px;--radius-card:10px;--bw-thin:1px;--touch-target-size:44px;--fg:#f5f5f5;--border:#454545;--accent:#8aa8ff;--surface:#18191d;--transition:150ms ease}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090a0c;color:var(--fg);font:var(--fs-body)/1.4 system-ui,sans-serif}[data-conformance-route]{min-height:100vh;padding:12px}[data-conformance-role="navigation"]{display:flex;gap:8px;align-items:center}[data-conformance-role="page-title"]{font-size:20px;margin:16px 0}[data-conformance-role="primary-action"],[data-conformance-role="metric"],[data-conformance-role="focus-target"]{min-height:var(--touch-target-size)}.k-btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--touch-target-size);padding:8px 12px;font-size:var(--fs-body);border:var(--bw-thin) solid var(--accent);border-radius:var(--radius);color:var(--fg);background:transparent;transition:opacity var(--transition)}.k-chip{display:inline-flex;align-items:center;min-height:var(--touch-target-size);padding:8px 12px;font-size:var(--fs-caption);border:var(--bw-thin) solid var(--border);border-radius:var(--radius-full)}.k-card{min-height:var(--touch-target-size);padding:16px;border:var(--bw-thin) solid var(--border);border-radius:var(--radius-card);background:var(--surface)}.k-well{min-height:var(--touch-target-size);padding:12px;border-radius:var(--radius);background:var(--surface)}.k-overlay{position:fixed;z-index:20;right:8px;bottom:8px;width:calc(100vw - 16px);min-height:var(--touch-target-size);max-height:180px;overflow:auto;padding:12px;border:var(--bw-thin) solid var(--border);border-radius:var(--radius);background:var(--surface)}.route-grid{display:grid;grid-template-columns:1fr;gap:16px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}</style></head><body><main data-conformance-route="full-brief" aria-label="Full Brief"><nav data-conformance-role="navigation" aria-label="Full Brief navigation"><a class="k-chip" href="#main">Research</a><button class="k-btn" data-conformance-role="focus-target" type="button">Open</button></nav><h1 data-conformance-role="page-title">Full Brief</h1><section id="main" class="route-grid"><article class="k-card" data-conformance-role="metric"><strong>Revenue</strong><a class="k-chip" href="#revenue">View series</a></article><aside class="k-well" data-conformance-role="focus-target" data-conformance-motion><button class="k-btn" data-conformance-role="primary-action" type="button">Run analysis</button></aside></section><div class="k-overlay" data-conformance-role="overlay" role="dialog" aria-label="Full Brief detail">Detail drawer <button class="k-btn" type="button">Close</button></div></main></body></html>
