# Local quality gate. Install once with `pre-commit install` (and
# `pre-commit install --hook-type pre-push` for the heavier pyright stage).
#
# pre-commit passes ONLY the changed files to each hook, which is exactly the
# project's "gate only on YOUR files" norm (the repo carries a large pre-existing
# ruff/pyright baseline — see directives/regrade_memo_post_wedge.md). New/edited
# code is kept clean without blocking on legacy debt.
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a # v1.5.0  # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args:
          - --exclude-files
          - >-
            ^(?:config[\\/]filing_xbrl_processor_(?:approval|bundle)\.json|
            docs[\\/]design[\\/]deletion_catalog_2026_08\.json|
            docs[\\/]hardening[\\/]L1[\\/]deletion_recovery_receipt_2026_08_08\.json|
            evals[\\/]golden[\\/]metric_lifecycle_triage\.json|
            tests[\\/](?:test_etf_instrument_mvp|test_gemini_backend|
            test_peer_selection|test_validate_environment)\.py)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      # Auto-format changed files, then lint-with-autofix. Order matters:
      # format first so the linter sees final layout.
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: public-tree-boundary
        name: public tree boundary
        entry: python execution/verify_public_tree.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Strict type gate on changed files. Heavier, so it runs at pre-push
      # rather than on every commit. Requires the project deps installed
      # (`pip install -e .[dev]`) so imports resolve.
      - id: pyright
        name: pyright (strict, changed files)
        entry: pyright
        language: system
        types: [python]
        exclude: ^(alembic/versions/|scratch/)
        stages: [pre-push]
